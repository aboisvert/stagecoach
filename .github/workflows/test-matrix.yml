name: test-matrix
# Reusable test job. Each platform/backend has a thin caller workflow so that
# GitHub can render a separate status badge per platform.
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      backend:
        description: STAGECOACH_TEST_BACKEND value (io_uring, epoll, or auto)
        required: true
        type: string
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    env:
      STAGECOACH_TEST_BACKEND: ${{ inputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.4.2
      - name: Install stagelane
        run: |
          mkdir -p deps
          git clone https://github.com/ghazalialshafi/stagelane deps/stagelane
          git -C deps/stagelane checkout 6c6df8a7868330c042cdfb0725b23f1874049bfa
      - uses: extractions/setup-just@v2
      - run: just test-unit
      - run: just test-integration
      - run: just examples
      - name: Test backend failure and override behavior
        if: runner.os == 'Linux' && inputs.backend == 'io_uring'
        run: |
          nim c -r --hints:off --threads:on --outdir:bin -d:stagecoachBackendTest -d:stagecoachTestRingUnavailable tests/integration/t_backend_startup.nim
          nim c -r --hints:off --threads:on --outdir:bin -d:stagecoachBackendTest -d:stagecoachIoUring -d:stagecoachTestRingFailOne tests/integration/t_backend_startup.nim
          nim c -r --hints:off --threads:on --outdir:bin -d:stagecoachBackendTest -d:stagecoachEpoll -d:stagecoachTestEnableRingInHandler tests/integration/t_backend_startup.nim
